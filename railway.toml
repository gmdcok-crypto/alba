# Railway — Nixpacks만 사용 (Dockerfile / Railpack 자동 Docker 빌드 사용 안 함)
# 대시보드 Settings → Build → Builder = Nixpacks

[build]
builder = "NIXPACKS"
# pip 는 Nixpacks Python 설치 단계에서 이미 함. 여기서 다시 깔지 않음.
# NODE_ENV=production 이면 vite/tsc 가 빠지므로 --include=dev 로 프론트 빌드.
# tsc 는 noEmit 타입체크라 배포에 필요 없음. vite build 만 함.
buildCommand = "cd client && npm ci --include=dev && npx vite build"

[deploy]
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT --log-level warning"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
